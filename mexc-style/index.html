<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEXC-style estimate — Web</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b12;color:#e9eef7;font:15px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
main{max-width:1080px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
a{color:#7db4ff}
h1{font-size:20px;margin:0 0 4px}.muted{color:#8e9bad}.card{background:#101622;border:1px solid #202b3b;border-radius:16px;padding:15px;margin-top:14px}
.big{font-size:34px;font-weight:800}.long{color:#39d98a}.short{color:#ff5f6d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{font-size:12px;color:#8e9bad}.v{font-size:17px;font-weight:700;margin-top:3px}
canvas{width:100%;height:420px;display:block}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#192334}
.evt{display:flex;gap:8px;margin-top:8px;font-size:12.5px}.dot{width:6px;height:6px;border-radius:50%;background:#8e9bad;margin-top:5px;flex-shrink:0}
.evt .t{color:#8e9bad;font-size:11px}.evt .title{font-size:12.5px;font-weight:600}.evt .note{color:#8e9bad;font-size:11px}
.events-hd{font-size:13px;color:#8e9bad;margin-bottom:2px}
.cal-warn{font-size:12.5px;color:#f5b642;margin-top:4px}
.cta{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.cta div{flex:1;min-width:180px;border-radius:999px;padding:16px;text-align:center;font-weight:800}
.long-cta{background:#1c6b47}.short-cta{background:#8a3336}
@media(max-width:680px){.grid{grid-template-columns:1fr}.big{font-size:29px}canvas{height:340px}.card{padding:12px}main{padding:12px}}
</style>
</head>
<body><main>
<div class="top"><div><h1>MEXC-style estimate (реконструкция)</h1><div class="muted">ETH · <a href="../">← сравнение</a></div></div><div id="stamp" class="muted"></div></div>

<div class="card"><div class="top"><div><div class="k">4H НАПРАВЛЕНИЕ</div><div id="dir" class="big">—</div></div><div><div class="k">ETH LIVE</div><div id="price" class="big">—</div></div></div>
<div class="row" style="margin-top:12px"><span id="trend" class="pill">—</span><span id="rsi" class="pill">—</span><span id="macd" class="pill">—</span><span id="funding" class="pill">—</span><span id="sent" class="pill">—</span></div></div>

<div class="card"><canvas id="chart"></canvas>
<div class="muted small" style="margin-top:8px">P(рост) на 24ч: <b id="pup24">—</b></div>
</div>

<div class="card grid">
<div><div class="k">4H ОЖИДАНИЕ</div><div id="t4" class="v">—</div></div>
<div><div class="k">12H ОЖИДАНИЕ</div><div id="t12" class="v">—</div></div>
<div><div class="k">24H ОЖИДАНИЕ</div><div id="t24" class="v">—</div></div>
</div>

<div class="card"><div class="events-hd">СОБЫТИЯ · Forex Factory (High/Medium impact)</div><div id="events"></div></div>

<div class="cta">
  <div class="long-cta">Конфигурация long<br><span id="longpct">—</span></div>
  <div class="short-cta">Конфигурация short<br><span id="shortpct">—</span></div>
</div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/tunnel-engine.js"></script>
<script src="../assets/mexc-style-engine.js"></script>
<script>
let last = null;
const $ = id => document.getElementById(id);
const fmt = x => (x >= 0 ? '+' : '') + x.toFixed(3);

// Forex Factory covers macro releases only (rates, CPI, NFP, FOMC etc).
// It does NOT cover crypto-specific news (regulation/bills, exchange
// listings, token unlocks) -- so "no events" here is scoped to macro,
// not a claim that nothing crypto-relevant is happening. Shown once,
// only when the list is genuinely empty, so it doesn't clutter every load.
const CALENDAR_SCOPE_NOTE = 'Только макро (ставки, CPI, NFP, FOMC) — крипто-новости (регуляция, листинги, анлоки) сюда не входят.';

function renderEvents(d) {
  const evEl = $('events');
  evEl.innerHTML = '';
  if (d.calendarStatus && d.calendarStatus !== 'ok') {
    evEl.innerHTML = `<div class="cal-warn">Календарь Forex Factory временно недоступен (лимит запросов источника) — список может быть неполным. Обновится само в течение часа.</div>`;
    return;
  }
  if (!d.events.length) {
    evEl.innerHTML = `<div class="muted small">Нет high/medium-impact событий в ближайшие 72ч. ${CALENDAR_SCOPE_NOTE}</div>`;
    return;
  }
  for (const e of d.events) {
    const row = document.createElement('div'); row.className = 'evt';
    const time = new Date(e.t).toISOString().slice(5, 16).replace('T', ' ');
    row.innerHTML = `<div class="dot"></div><div><span class="t">${time} UTC</span> · <span class="title">${e.title}</span>${e.note ? ` <span class="note">(${e.note})</span>` : ''}</div>`;
    evEl.appendChild(row);
  }
}

async function load() {
  try {
    const d = await buildMexcStyleEstimate();
    last = d;
    $('dir').textContent = d.direction;
    $('dir').className = 'big ' + (d.direction === 'LONG' ? 'long' : 'short');
    $('price').textContent = d.livePrice.toFixed(2);
    $('trend').textContent = 'TREND ' + fmt(d.factors.trend);
    $('rsi').textContent = 'RSI ' + fmt(d.factors.rsi);
    $('macd').textContent = 'MACD ' + fmt(d.factors.macd);
    $('funding').textContent = 'FUNDING ' + fmt(d.factors.funding);
    $('sent').textContent = 'F&G ' + d.factors.fgiRaw;
    $('pup24').textContent = (d.pUp7dLike * 100).toFixed(1) + '%';
    $('longpct').textContent = d.longPct + '% Алгоритм за рост';
    $('shortpct').textContent = d.shortPct + '% Алгоритм за падение';
    for (const h of [4, 12, 24]) $('t' + h).textContent = d.targets[h + 'h'].toFixed(2);
    renderEvents(d);
    $('stamp').textContent = new Date().toLocaleString();
    drawTunnelChart($('chart'), d.historyClosed15m, d.tunnel, d.originPrice, NaN, d.direction);
  } catch (e) {
    $('stamp').textContent = 'Ошибка данных: ' + e.message;
    console.error(e);
  }
}
addEventListener('resize', () => last && drawTunnelChart($('chart'), last.historyClosed15m, last.tunnel, last.originPrice, NaN, last.direction));
load();
setInterval(load, 60000);
</script>
</body></html>
